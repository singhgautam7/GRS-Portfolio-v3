<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="tokens.css"></helmet>
<svg ref="{{ svgRef }}" viewBox="{{ vb }}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:100%;display:block;overflow:visible">
  <defs>
    <linearGradient id="{{ gid.top }}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:#fff;stop-opacity:{{ ga.top }}"></stop><stop offset=".55" style="stop-color:#fff;stop-opacity:0"></stop><stop offset="1" style="stop-color:#000;stop-opacity:.07"></stop></linearGradient>
    <linearGradient id="{{ gid.side }}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:#fff;stop-opacity:{{ ga.side }}"></stop><stop offset=".55" style="stop-color:#000;stop-opacity:0"></stop><stop offset="1" style="stop-color:#000;stop-opacity:{{ ga.ao }}"></stop></linearGradient>
    <linearGradient id="{{ gid.cyl }}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:#000;stop-opacity:.16"></stop><stop offset=".28" style="stop-color:#fff;stop-opacity:{{ ga.spec }}"></stop><stop offset=".42" style="stop-color:#fff;stop-opacity:0"></stop><stop offset="1" style="stop-color:#000;stop-opacity:.32"></stop></linearGradient>
    <filter id="{{ gid.blur }}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="{{ blurSd }}"></feGaussianBlur></filter>
  </defs>
  <g filter="{{ blurUrl }}">
    <sc-for list="{{ shadows }}" as="sh" hint-placeholder-count="0">
      <path d="{{ sh.d }}" style="{{ sh.style }}"></path>
    </sc-for>
  </g>
  <sc-for list="{{ lines }}" as="l" hint-placeholder-count="0">
    <path d="{{ l.d }}" style="{{ l.style }}"></path>
  </sc-for>
  <sc-for list="{{ arrows }}" as="ar" hint-placeholder-count="0">
    <path d="{{ ar.d }}" style="{{ ar.style }}"></path>
  </sc-for>
  <sc-for list="{{ particles }}" as="p" hint-placeholder-count="0">
    <circle cx="{{ p.x }}" cy="{{ p.y }}" r="{{ p.r }}" style="{{ p.style }}"></circle>
  </sc-for>
  <sc-for list="{{ shapes }}" as="s" hint-placeholder-count="0">
    <path d="{{ s.d }}" style="{{ s.style }}"></path>
  </sc-for>
  <sc-for list="{{ labels }}" as="lb" hint-placeholder-count="0">

</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:620},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;healthy&quot;,&quot;stressed&quot;,&quot;overloaded&quot;,&quot;failure&quot;,&quot;recovered&quot;],&quot;default&quot;:&quot;healthy&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;animate&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;lb&quot;,&quot;app&quot;,&quot;cache&quot;,&quot;db&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;servers&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:1,&quot;max&quot;:6,&quot;tsType&quot;:&quot;number&quot;},&quot;tier&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;S&quot;,&quot;M&quot;,&quot;L&quot;,&quot;XL&quot;],&quot;default&quot;:&quot;M&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;failed&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;server&quot;,&quot;cache&quot;,&quot;db&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;labels&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;unit&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:48,&quot;tsType&quot;:&quot;number&quot;},&quot;pad&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:30,&quot;tsType&quot;:&quot;number&quot;}}">

    const pct = h => Math.round(h * 100) + '%';
    const L2 = [
      [users, 'Users', 'visitors'],
      [cdn, 'CDN', 'edge cache'],
      [lb, 'Load balancer', pct(H.lb)],
      [{ x: 9.5, y: 1.4 - (servers - 1) / 2 * 1.35 - 0.6, top: tierH * 0.3 + 0.2 }, 'App servers', `${servers} × ${tier} · ${pct(H.app)}`, 'app'],
      [cache, 'Cache', cacheDead ? 'offline' : '82% hit · ' + pct(H.cache), 'cache'],
      [db, 'Database', failed === 'db' ? 'primary down' : 'primary · ' + pct(H.db), 'db'],
      [{ x: 15.3, y: 2.2, top: 1.6 }, failed === 'db' ? 'Replica → primary' : 'Read replicas', failed === 'db' ? 'promoting… ' + pct(H.rep) : '2 · ' + pct(H.rep)],
      [{ x: 11.9, y: 5.5, top: 0.35 }, 'Queue', st === 'overloaded' ? 'backlog 4.2k' : 'backlog 12'],
      [{ x: 15.2, y: 5.4, top: 0.7 }, 'Workers', '3'],
    ];
    if (ghost) L2.push([{ x: ghost.x + ghost.w / 2, y: ghost.y + ghost.d / 2, top: ghost.h }, 'Object storage', 'drop to connect', 'ghost']);
    const labs = labelsOn ? L2.map(([p, name, sub, id]) => {
      const [sx, sy] = pr(p.x, p.y, p.top + 0.35); const w = Math.max(name.length, sub.length) * 7 + 20;
      const bad = /down|offline/.test(sub) || (id && (id === 'app' ? H.app : id === 'db' ? H.db : 0) > .92);
      pts.push([sx - w / 2, sy - 32]);
      return { tf: `translate(${f1(sx)} ${f1(sy)})`, rx: f1(-w / 2), w: f1(w), h: 36, name, sub, box: `box-sizing:border-box;height:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);border:${sel === id || id === 'ghost' ? '1.5px solid var(--accent)' : '1px solid var(--line-2)'};border-radius:8px;box-shadow:0 6px 14px -8px rgba(0,0,0,.35)`, subStyle: `font-family:var(--font-mono);font-size:10px;line-height:1.3;white-space:nowrap;color:${bad ? 'var(--danger)' : id === 'ghost' ? 'var(--accent-text)' : 'var(--ink-3)'}` };
    }) : [];
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    pts.forEach(([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); });
    const pad = P.pad ?? 30;
    const cols = this.cols || {};
    const rv = str => str.replace(/var\((--[\w-]+)\)/g, (m, n) => cols[n] || m);
    const so = s => { s = rv(s); const o = {}; s.split(';').forEach(kv => { const i = kv.indexOf(':'); if (i < 0) return; const k = kv.slice(0, i).trim().replace(/-([a-z])/g, (m, c) => c.toUpperCase()); o[k] = kv.slice(i + 1).trim(); }); return o; };
    shapes.forEach(s => s.style = so(s.style)); lines.forEach(s => s.style = so(s.style)); particles.forEach(s => s.style = so(s.style)); arrows.forEach(s => s.style = so(s.style)); shadowsL.forEach(s => s.style = so(s.style));
    labs.forEach(l => { l.box = so(l.box); l.subStyle = so(l.subStyle); });
    return { svgRef: this.svgRef, vb: `${f1(x0 - pad)} ${f1(y0 - pad)} ${f1(x1 - x0 + pad * 2)} ${f1(y1 - y0 + pad * 2 + 40)}`, shapes, lines, particles, labels: labs, arrows, shadows: shadowsL,
      gid: { top: U + '-top', side: U + '-side', cyl: U + '-cyl', blur: U + '-blur' }, blurUrl: `url(#${U}-blur)`, blurSd: (u * .16).toFixed(1),
      ga: { top: dark ? .16 : .55, side: dark ? .05 : .14, ao: dark ? .35 : .2, spec: dark ? .14 : .4 } };
  }
}
